<!doctype html>
<!-- taste-skill motion demo: every micro-interaction of assets/motion on one company page, light and dark.
     Open it served from the skill folder (http://localhost:<port>/assets/motion/demo.html).
     ?theme=dark starts dark; ?live keeps the number tick in a headless screenshot. -->
<html lang="en" data-radius="soft" data-ground="sky" data-motion>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stackline: plan and ship product work, for small software teams</title>
<meta name="description" content="The taste-skill motion layer on one page: buttons, links, nav, tabs, cards, loops, photographs, numbers, fields, FAQ.">
<script>
  (() => {
    const q = new URLSearchParams(location.search), h = document.documentElement;
    if (q.get('theme') === 'dark') h.dataset.theme = 'dark';
    if (q.has('live')) h.dataset.motion = 'live';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../system.css">
